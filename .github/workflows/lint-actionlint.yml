name: lint actions

on:
  pull_request:
    paths:
      - '.github/workflows/**'

jobs:
  lint-actionlint:
    runs-on: ubuntu-24.04

    steps:
       - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

       - uses: reviewdog/action-actionlint@v1.72
         with:
           github_token: ${{ secrets.GITHUB_TOKEN }}
           reporter: github-pr-check
